tun:
  enable: true
  # Windows 推荐 mixed: TCP 走系统栈, UDP 走 gvisor
  stack: mixed
  # 劫持所有传统 DNS 查询, 防止系统 DNS 绕过 mihomo
  dns-hijack:
    - 0.0.0.0:53
  auto-detect-interface: true
  auto-route: true
  strict-route: true
